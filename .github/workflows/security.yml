name: Security

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: '0 4 * * 0'

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crypto-experiments

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crypto-experiments/requirements-dev.txt

      - name: Install CI security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Bandit scan
        run: |
          python -m bandit -r application domain scripts --confidence high --severity high

  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crypto-experiments

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crypto-experiments/requirements-dev.txt

      - name: Install CI security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pip-audit
        run: |
          python -m pip_audit --requirements requirements.txt
