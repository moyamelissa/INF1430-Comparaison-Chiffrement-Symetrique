---
name: Tests

'on':
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crypto-experiments

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crypto-experiments/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Install CI security tooling
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run dependency vulnerability scan
        run: |
          python -m pip_audit --requirements requirements.txt

      - name: Run tests with coverage
        run: python -m pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            crypto-experiments/coverage.xml
            crypto-experiments/htmlcov

  kat:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crypto-experiments

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crypto-experiments/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycryptodome twofish pytest pytest-cov

      - name: Run KAT suite
        run: |
          python scripts/run_kat.py --twofish-profile full --twofish-checksum warn

  ic95-audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crypto-experiments

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crypto-experiments/requirements.txt

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run IC95 audit quality gates
        run: python scripts/audit/audit_ic95.py --enforce-gates

      - name: Upload IC95 audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ic95-audit-report
          path: |
            crypto-experiments/data/evidence/ic95_raw_rows.csv
            crypto-experiments/data/evidence/ic95_audit_report.csv
