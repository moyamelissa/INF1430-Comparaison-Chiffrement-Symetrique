[pytest]
minversion = 8.0
testpaths = crypto-experiments/tests
python_files = test_*.py
pythonpath = crypto-experiments
addopts = --cov=domain --cov=application --cov=validation --cov=crypto-experiments/scripts/audit --cov-branch --cov-report=term-missing --cov-report=xml:crypto-experiments/data/evidence/test/coverage.xml --cov-report=html:crypto-experiments/htmlcov --cov-fail-under=100
